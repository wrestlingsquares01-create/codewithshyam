<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code With #Shyam | Python Portal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #000000);
      background-size: 400% 400%;
      animation: bgMove 15s ease infinite;
      overflow: hidden;
      color: white;
    }

    @keyframes bgMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .intro {
      text-align: center;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .intro.hidden {
      opacity: 0;
      transform: translateY(-20px);
      pointer-events: none;
      position: absolute;
    }

    .title {
  font-family: 'Outfit', sans-serif;
  font-size: 4.5rem;
  font-weight: 800;
  letter-spacing: -2px;
  text-transform: none;
  background: linear-gradient(135deg, 
    #ffffff 0%, 
    #00f7ff 25%, 
    #ff00e6 50%, 
    #00f7ff 75%, 
    #ffffff 100%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  animation: shimmer 3s linear infinite, floatText 3s ease-in-out infinite;
  margin-bottom: 20px;
  position: relative;
  filter: drop-shadow(0 0 30px rgba(0, 247, 255, 0.4));
  line-height: 1.1;
}

.title::before {
  content: 'Code With';
  display: block;
  font-size: 1.5rem;
  font-weight: 300;
  letter-spacing: 8px;
  text-transform: uppercase;
  background: linear-gradient(90deg, transparent, #00f7ff, transparent);
  background-size: 200% auto;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shimmer 2s linear infinite;
  margin-bottom: 5px;
  filter: drop-shadow(0 0 10px rgba(0, 247, 255, 0.3));
}

.title::after {
  content: '';
  position: absolute;
  bottom: -15px;
  left: 50%;
  transform: translateX(-50%);
  width: 150px;
  height: 3px;
  background: linear-gradient(90deg, transparent, #00f7ff, #ff00e6, #00f7ff, transparent);
  background-size: 200% auto;
  animation: shimmer 2s linear infinite;
  border-radius: 2px;
  filter: blur(1px);
}

@keyframes shimmer {
  0% { background-position: 0% center; }
  100% { background-position: 200% center; }
}

@keyframes floatText {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

@keyframes pulse {
  from { transform: scale(1); }
  to { transform: scale(1.03); }
}

    .subtitle {
      font-size: 1.3rem;
      color: #dcdcdc;
      animation: blink 1s infinite;
    }

    @keyframes pulse {
      from { transform: scale(1); text-shadow: 0 0 10px #00f7ff; }
      to { transform: scale(1.08); text-shadow: 0 0 25px #00f7ff, 0 0 40px #00f7ff; }
    }

    @keyframes blink { 50% { opacity: 0.5; } }

    .menu {
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      width: 100%;
      padding: 20px;
      position: absolute;
      pointer-events: none;
    }

    .menu.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .menu-title {
      font-size: 2.2rem;
      margin-bottom: 30px;
      color: #00f7ff;
      text-shadow: 0 0 10px rgba(0, 247, 255, 0.5);
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 500px;
      margin: 0 auto;
    }

    .btn {
      padding: 18px 30px;
      font-size: 1.2rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: white;
      background: rgba(0, 0, 0, 0.4);
      border: 2px solid #00f7ff;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 20px rgba(0, 247, 255, 0.4);
      background: rgba(0, 247, 255, 0.1);
    }

    /* Modi on Index - floating */
    .modi-index {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 180px;
      z-index: 1000;
      pointer-events: none;
      filter: drop-shadow(0 0 15px rgba(0, 247, 255, 0.3));
      animation: floatUpDown 3s ease-in-out infinite;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .modi-index.show { opacity: 1; }

    @keyframes floatUpDown {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
    }

    .speech-index {
      position: fixed;
      bottom: 210px;
      right: 10px;
      background: #00f7ff;
      color: #000;
      padding: 10px 15px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: bold;
      max-width: 200px;
      text-align: center;
      z-index: 1001;
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }

    .speech-index.show { opacity: 1; }

    .speech-index::after {
      content: '';
      position: absolute;
      bottom: -8px;
      right: 30px;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 8px solid #00f7ff;
    }

    @media (max-width: 600px) {
      .title { font-size: 2.2rem; }
      .menu-title { font-size: 1.5rem; }
      .btn { padding: 15px 20px; font-size: 1rem; }
      .buttons { width: 90%; }
      .modi-index { width: 120px; bottom: 10px; right: 10px; }
      .speech-index { bottom: 140px; right: 5px; font-size: 0.75rem; max-width: 140px; }
    }
  </style>
</head>
<body>

  <div class="intro" id="intro">
    <div class="title">#Shyam</div>
    <div class="subtitle">Initializing Python Class...</div>
  </div>

  <div class="menu" id="menu">
    <div class="menu-title">Select Chapter</div>
            <div class="buttons">
      <a href="chapter1.html" class="btn">
        <span>📖</span> Chapter 1 - Python Basics
      </a>
      <a href="help.html" class="btn" style="border-color: #ff6600;">
        <span>💬</span> Chat with Shyam Sir
      </a>
      <a href="#" class="btn" style="border-color:#555;color:#888;cursor:not-allowed;" onclick="event.preventDefault();alert('Chapter 2 coming soon! 😎')">
        <span>🔒</span> Chapter 2 (Coming Soon)
      </a>
    </div>
  </div>

  <img src="modi.png" alt="" class="modi-index" id="modiIndex" />
  <div class="speech-index" id="speechIndex">Mitron, Python Seekho! 🇮🇳</div>

  <script>
    setTimeout(function () {
      document.getElementById('intro').classList.add('hidden');
      document.getElementById('menu').classList.add('visible');
      setTimeout(function () {
        document.getElementById('modiIndex').classList.add('show');
        document.getElementById('speechIndex').classList.add('show');
      }, 500);
    }, 3000);

    const indexDialogues = [
      "Mitron, Python Seekho! 🇮🇳",
      "Coding ka zamana hai!",
      "Shyam sir se seekho! 😎",
      "Chapter 1 start karo!",
      "Digital India, Coding India!"
    ];
    let idxDlg = 0;
    setInterval(function () {
      idxDlg = (idxDlg + 1) % indexDialogues.length;
      const b = document.getElementById('speechIndex');
      b.style.opacity = '0';
      setTimeout(function () {
        b.textContent = indexDialogues[idxDlg];
        b.style.opacity = '1';
      }, 300);
    }, 3000);
  </script>
</body>
</html>
