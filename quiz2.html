<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Chapter 2 | Code With #Shyam</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0a1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
    }
    .quiz-container { max-width: 700px; width: 100%; margin: 0 auto; }
    .quiz-header {
      text-align: center;
      padding: 25px;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      border-radius: 15px;
      border: 1px solid #00f7ff33;
      margin-bottom: 25px;
    }
    .quiz-header h1 { font-size: 1.8rem; color: #00f7ff; text-shadow: 0 0 10px rgba(0, 247, 255, 0.5); }
    .quiz-header p { color: #aaa; margin-top: 5px; font-size: 0.95rem; }
    .quiz-header .brand { color: #fff; font-weight: bold; font-size: 1rem; margin-top: 8px; }
    .progress-section { margin-bottom: 20px; }
    .progress-bar-bg { width: 100%; height: 8px; background: #1a1a3e; border-radius: 10px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: linear-gradient(to right, #00f7ff, #00ff88); border-radius: 10px; transition: width 0.5s ease; width: 0%; }
    .progress-text { text-align: right; font-size: 0.85rem; color: #888; margin-top: 5px; }
    .question-card {
      background: #111133;
      border-radius: 12px;
      padding: 25px;
      border-left: 4px solid #00f7ff;
      margin-bottom: 20px;
      animation: slideIn 0.4s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .question-number { color: #00f7ff; font-size: 0.9rem; font-weight: bold; margin-bottom: 10px; }
    .question-text { font-size: 1.15rem; color: #fff; margin-bottom: 20px; line-height: 1.6; }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .option-btn {
      padding: 14px 18px;
      background: #1a1a3e;
      border: 2px solid #333;
      border-radius: 10px;
      color: #ccc;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
    }
    .option-btn:hover { border-color: #00f7ff; background: #00f7ff11; color: #fff; transform: translateX(5px); }
    .option-btn.correct { border-color: #00ff88 !important; background: #00ff8822 !important; color: #00ff88 !important; font-weight: bold; }
    .option-btn.wrong { border-color: #ff4444 !important; background: #ff444422 !important; color: #ff4444 !important; }
    .option-btn.disabled { pointer-events: none; }
    .explanation {
      margin-top: 15px;
      padding: 12px;
      background: #1a1a00;
      border: 1px solid #ffa500;
      border-radius: 8px;
      color: #ffa500;
      font-size: 0.9rem;
      display: none;
    }
    .explanation.show { display: block; animation: slideIn 0.3s ease; }
    .next-btn {
      display: none;
      margin-top: 15px;
      padding: 12px 30px;
      background: linear-gradient(135deg, #00f7ff, #0088ff);
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
    }
    .next-btn:hover { transform: translateY(-2px); box-shadow: 0 0 15px rgba(0, 247, 255, 0.4); }
    .next-btn.show { display: block; }
    .score-section { display: none; text-align: center; }
    .score-section.show { display: block; }
    .score-card { background: linear-gradient(135deg, #0f0c29, #302b63); border-radius: 15px; padding: 40px; border: 2px solid #00f7ff33; }
    .score-emoji { font-size: 4rem; margin-bottom: 15px; }
    .score-title { font-size: 1.8rem; color: #00f7ff; margin-bottom: 10px; }
    .score-number { font-size: 3.5rem; font-weight: bold; margin: 15px 0; }
    .score-number.excellent { color: #00ff88; text-shadow: 0 0 20px rgba(0, 255, 136, 0.5); }
    .score-number.good { color: #ffa500; text-shadow: 0 0 20px rgba(255, 165, 0, 0.5); }
    .score-number.poor { color: #ff4444; text-shadow: 0 0 20px rgba(255, 68, 68, 0.5); }
    .score-message { font-size: 1.1rem; color: #ccc; margin-bottom: 20px; }
    .score-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
    .score-btn { padding: 14px 25px; border-radius: 8px; font-size: 1rem; font-weight: bold; text-decoration: none; text-align: center; cursor: pointer; transition: all 0.3s ease; border: none; }
    .score-btn:hover { transform: translateY(-3px); }
    .btn-retry { background: linear-gradient(135deg, #ff0066, #ff6600); color: white; }
    .btn-home { background: transparent; border: 2px solid #00f7ff !important; color: #00f7ff; }
    .btn-chapter { background: transparent; border: 2px solid #00ff88 !important; color: #00ff88; }
    .live-score { display: flex; justify-content: space-between; margin-bottom: 15px; padding: 10px 15px; background: #111133; border-radius: 10px; font-size: 0.9rem; }
    .live-score span { color: #888; }
    .live-score .correct-count { color: #00ff88; font-weight: bold; }
    .live-score .wrong-count { color: #ff4444; font-weight: bold; }
    @media (max-width: 600px) {
      .quiz-header h1 { font-size: 1.4rem; }
      .question-text { font-size: 1rem; }
      .score-number { font-size: 2.5rem; }
    }
  </style>
</head>
<body>
  <div class="quiz-container">
    <div class="quiz-header">
      <h1>🧠 Chapter 2 - Quiz</h1>
      <p>Comments, Variables & Operators ka test!</p>
      <div class="brand">Code With #Shyam</div>
    </div>

    <div class="live-score" id="liveScore">
      <span>✅ Correct: <span class="correct-count" id="correctCount">0</span></span>
      <span>❌ Wrong: <span class="wrong-count" id="wrongCount">0</span></span>
    </div>

    <div class="progress-section">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
      <div class="progress-text" id="progressText">Question 1 of 10</div>
    </div>

    <div id="questionArea"></div>

    <div class="score-section" id="scoreSection">
      <div class="score-card">
        <div class="score-emoji" id="scoreEmoji">🎉</div>
        <div class="score-title">Quiz Complete!</div>
        <div class="score-number" id="scoreNumber">0/10</div>
        <div class="score-message" id="scoreMessage">Great job!</div>
        <div class="score-buttons">
          <button class="score-btn btn-retry" onclick="restartQuiz()">🔄 Dobara Try Karo</button>
          <a href="chapter2.html" class="score-btn btn-chapter">📖 Notes Dobara Padho</a>
          <a href="index.html" class="score-btn btn-home">🏠 Home Page</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const questions = [
      {
        question: "Python mein single line comment likhne ke liye kaun sa symbol use hota hai?",
        options: ["//", "#", "/* */", "--"],
        correct: 1,
        explanation: "Python mein # symbol use hota hai single line comment ke liye. Jaise: # Ye comment hai"
      },
      {
        question: "Multi-line comment kaise likhte hain Python mein?",
        options: [
          "// comment //",
          "<!-- comment -->",
          "\"\"\" comment \"\"\" (triple quotes)",
          "/* comment */"
        ],
        correct: 2,
        explanation: "Multi-line comments ke liye triple quotes (\"\"\") use hote hain — start aur end dono mein!"
      },
      {
        question: "Prashant ne likha: 'a = 30'. Yahan 'a' kya hai?",
        options: ["Function", "Variable", "Keyword", "String"],
        correct: 1,
        explanation: "'a' ek variable hai jo value 30 store kar raha hai. Variable = data ka dabba! 📦"
      },
      {
        question: "Python mein kitne main data types hote hain?",
        options: ["3", "4", "5", "7"],
        correct: 2,
        explanation: "Python mein 5 main data types hain: Integer, Float, String, Boolean, aur None!"
      },
      {
        question: "Aham ne likha: 'name = \"Shyam\"'. Ye kaunsa data type hai?",
        options: ["Integer", "Float", "String", "Boolean"],
        correct: 2,
        explanation: "Quotes ke andar likha kuch bhi String hota hai! \"Shyam\" ek String hai."
      },
      {
        question: "Kaunsa variable name VALID hai?",
        options: ["1shyam", "my name", "shyam_1", "@shyam"],
        correct: 2,
        explanation: "'shyam_1' valid hai! Variable alphabet/underscore se start hota hai, digit ya space allowed nahi!"
      },
      {
        question: "Aditya ne likha: 'b = 88.44'. Ye kaunsa data type hai?",
        options: ["Integer", "Float", "String", "None"],
        correct: 1,
        explanation: "Decimal point (.) wale numbers Float hote hain! 88.44 = float ✅"
      },
      {
        question: "Kaunsa operator ARITHMETIC nahi hai?",
        options: ["+", "-", "==", "*"],
        correct: 2,
        explanation: "'==' comparison operator hai (equal check karta hai). +, -, *, / arithmetic hain!"
      },
      {
        question: "Nishant ne likha: '10 == 10'. Iska output kya hoga?",
        options: ["10", "True", "False", "Error"],
        correct: 1,
        explanation: "== check karta hai equal hai ya nahi. 10 == 10 → True (kyunki dono barabar hain)! ✅"
      },
      {
        question: "Kaunsa LOGICAL operator hai?",
        options: ["+", "and", "==", "="],
        correct: 1,
        explanation: "'and', 'or', 'not' logical operators hain! Ye True/False ke saath kaam karte hain."
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let wrongAnswers = 0;

    function loadQuestion() {
      const q = questions[currentQuestion];
      const area = document.getElementById('questionArea');
      const progress = ((currentQuestion) / questions.length) * 100;
      document.getElementById('progressBar').style.width = progress + '%';
      document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;

      let optionsHTML = '';
      q.options.forEach((opt, index) => {
        optionsHTML += `<button class="option-btn" onclick="checkAnswer(${index})">${opt}</button>`;
      });

      area.innerHTML = `
        <div class="question-card">
          <div class="question-number">Question ${currentQuestion + 1} / ${questions.length}</div>
          <div class="question-text">${q.question}</div>
          <div class="options" id="optionsContainer">
            ${optionsHTML}
          </div>
          <div class="explanation" id="explanation">
            💡 ${q.explanation}
          </div>
          <button class="next-btn" id="nextBtn" onclick="nextQuestion()">
            ${currentQuestion === questions.length - 1 ? '📊 Result Dekho!' : 'Next Question ➡️'}
          </button>
        </div>
      `;
    }

    function checkAnswer(selected) {
      const q = questions[currentQuestion];
      const buttons = document.querySelectorAll('.option-btn');
      const explanation = document.getElementById('explanation');
      const nextBtn = document.getElementById('nextBtn');

      buttons.forEach((btn, index) => {
        btn.classList.add('disabled');
        if (index === q.correct) btn.classList.add('correct');
        if (index === selected && selected !== q.correct) btn.classList.add('wrong');
      });

      if (selected === q.correct) {
        score++;
        document.getElementById('correctCount').textContent = score;
      } else {
        wrongAnswers++;
        document.getElementById('wrongCount').textContent = wrongAnswers;
      }

      explanation.classList.add('show');
      nextBtn.classList.add('show');
    }

    function nextQuestion() {
      currentQuestion++;
      if (currentQuestion < questions.length) {
        loadQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById('questionArea').style.display = 'none';
      document.getElementById('liveScore').style.display = 'none';
      document.querySelector('.progress-section').style.display = 'none';

      const scoreSection = document.getElementById('scoreSection');
      scoreSection.classList.add('show');

      const scoreNumber = document.getElementById('scoreNumber');
      const scoreEmoji = document.getElementById('scoreEmoji');
      const scoreMessage = document.getElementById('scoreMessage');

      scoreNumber.textContent = `${score} / ${questions.length}`;

      if (score >= 8) {
        scoreNumber.className = 'score-number excellent';
        scoreEmoji.textContent = '🏆';
        scoreMessage.textContent = 'Kamaal kar diya bhai! Chapter 2 master ho gaya! 🔥';
      } else if (score >= 5) {
        scoreNumber.className = 'score-number good';
        scoreEmoji.textContent = '👍';
        scoreMessage.textContent = 'Achha hai! Thoda aur practice kar! 💪';
      } else {
        scoreNumber.className = 'score-number poor';
        scoreEmoji.textContent = '📖';
        scoreMessage.textContent = 'Notes dobara padh aur try kar! Tu kar lega! 🙌';
      }
    }

    function restartQuiz() {
      currentQuestion = 0;
      score = 0;
      wrongAnswers = 0;
      document.getElementById('correctCount').textContent = '0';
      document.getElementById('wrongCount').textContent = '0';
      document.getElementById('questionArea').style.display = 'block';
      document.getElementById('liveScore').style.display = 'flex';
      document.querySelector('.progress-section').style.display = 'block';
      document.getElementById('scoreSection').classList.remove('show');
      loadQuestion();
    }

    loadQuestion();
  </script>
</body>
</html>
