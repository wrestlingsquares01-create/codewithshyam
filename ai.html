<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutor 🤖 - Code With Shyam</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Caveat:wght@400;600&family=Kalam&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a1a;
            --bg2: #0d0d20;
            --bg3: #111128;
            --cyan: #00f7ff;
            --cyan2: #00c4cc;
            --purple: #7c3aed;
            --pink: #ec4899;
            --green: #10b981;
            --orange: #f97316;
            --card: rgba(255,255,255,0.04);
            --border: rgba(0,247,255,0.15);
            --text: #e2e8f0;
            --text2: #94a3b8;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== BACKGROUND EFFECTS ===== */
        .bg-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }
        .bg-glow-1 {
            width: 400px; height: 400px;
            background: rgba(0,247,255,0.06);
            top: -100px; left: -100px;
        }
        .bg-glow-2 {
            width: 300px; height: 300px;
            background: rgba(124,58,237,0.08);
            bottom: 100px; right: -50px;
        }
        .bg-glow-3 {
            width: 200px; height: 200px;
            background: rgba(236,72,153,0.05);
            top: 50%; left: 50%;
            transform: translate(-50%,-50%);
        }

        /* ===== HEADER ===== */
        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            background: rgba(10,10,26,0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--cyan);
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            transition: all 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .back-btn:hover {
            background: rgba(0,247,255,0.1);
            transform: translateX(-3px);
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-badge {
            background: linear-gradient(135deg, var(--green), #059669);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* ===== MAIN LAYOUT ===== */
        .main-layout {
            display: flex;
            height: 100vh;
            padding-top: 65px;
            position: relative;
            z-index: 1;
        }

        /* ===== SIDE CHARACTERS ===== */
        .modi-side {
            position: fixed;
            bottom: 20px;
            right: 8px;
            width: 110px;
            z-index: 50;
        }

        .bapu-side {
            position: fixed;
            bottom: 20px;
            left: 8px;
            width: 100px;
            z-index: 50;
        }

        .modi-img {
            width: 100px;
            animation: modiFloat 3s ease-in-out infinite;
            filter: drop-shadow(0 0 15px rgba(255,165,0,0.5));
        }
        @keyframes modiFloat {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }

        .bapu-img {
            width: 90px;
            animation: bapuFloat 4s ease-in-out infinite;
            opacity: 0.9;
            filter: drop-shadow(0 0 10px rgba(255,215,100,0.3));
        }
        @keyframes bapuFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .modi-dialogue {
            position: fixed;
            bottom: 125px;
            right: 8px;
            background: linear-gradient(135deg, #ff6b00, #ff9500);
            color: white;
            padding: 8px 12px;
            border-radius: 12px 12px 0 12px;
            font-size: 11px;
            font-weight: 700;
            width: 115px;
            text-align: center;
            z-index: 50;
            animation: dialogueFade 4s ease-in-out infinite;
            box-shadow: 0 4px 15px rgba(255,107,0,0.4);
        }

        .bapu-dialogue {
            position: fixed;
            bottom: 115px;
            left: 8px;
            background: linear-gradient(135deg, #d4a843, #f0c060);
            color: #1a0a00;
            padding: 8px 10px;
            border-radius: 12px 12px 12px 0;
            font-size: 10px;
            font-weight: 600;
            width: 110px;
            text-align: center;
            z-index: 50;
            font-family: 'Caveat', cursive;
        }

        @keyframes dialogueFade {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(0.98); }
        }

        /* ===== CHAT AREA ===== */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            padding: 0 10px;
        }

        /* ===== WELCOME SECTION ===== */
        .welcome-section {
            padding: 30px 20px 10px;
            text-align: center;
        }

        .welcome-title {
            font-size: clamp(24px, 4vw, 36px);
            font-weight: 800;
            background: linear-gradient(135deg, var(--cyan), var(--purple), var(--pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .welcome-subtitle {
            color: var(--text2);
            font-size: 14px;
            margin-bottom: 15px;
        }

        .powered-by {
            display: inline-block;
            background: linear-gradient(135deg, rgba(249,115,22,0.15), rgba(236,72,153,0.15));
            border: 1px solid rgba(249,115,22,0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: var(--orange);
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* ===== QUICK SUGGESTIONS ===== */
        .suggestions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        .suggestion-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 15px;
            border-radius: 14px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            text-align: left;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .suggestion-btn:hover {
            background: rgba(0,247,255,0.08);
            border-color: var(--cyan);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,247,255,0.1);
        }
        .suggestion-icon {
            font-size: 20px;
        }
        .suggestion-text {
            line-height: 1.3;
        }
        .suggestion-text strong {
            display: block;
            color: var(--cyan);
            font-size: 12px;
            margin-bottom: 2px;
        }

        /* ===== MESSAGES ===== */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px 10px 20px;
            scroll-behavior: smooth;
        }

        .messages-container::-webkit-scrollbar {
            width: 4px;
        }
        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        .message {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            animation: msgAppear 0.4s ease-out;
        }

        @keyframes msgAppear {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            font-weight: 700;
        }

        .ai-avatar {
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            box-shadow: 0 0 15px rgba(0,247,255,0.3);
        }

        .user-avatar {
            background: linear-gradient(135deg, var(--orange), var(--pink));
            box-shadow: 0 0 15px rgba(249,115,22,0.3);
        }

        .msg-content {
            max-width: 75%;
        }

        .msg-name {
            font-size: 11px;
            color: var(--text2);
            margin-bottom: 5px;
            font-weight: 600;
        }

        .message.user .msg-name {
            text-align: right;
        }

        .msg-bubble {
            padding: 14px 18px;
            border-radius: 18px;
            line-height: 1.6;
            font-size: 14px;
            word-wrap: break-word;
        }

        .ai-bubble {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 4px 18px 18px 18px;
        }

        .user-bubble {
            background: linear-gradient(135deg, rgba(0,247,255,0.15), rgba(124,58,237,0.15));
            border: 1px solid rgba(0,247,255,0.25);
            border-radius: 18px 4px 18px 18px;
        }

        .msg-bubble pre {
            margin: 12px 0;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .msg-bubble pre code {
            font-family: 'Fira Code', monospace !important;
            font-size: 13px !important;
            padding: 12px !important;
            display: block;
            overflow-x: auto;
        }

        .code-block-wrapper {
            margin: 12px 0;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .code-header {
            background: #1a1a2e;
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .code-lang {
            color: var(--cyan);
            font-size: 12px;
            font-weight: 600;
            font-family: 'Fira Code', monospace;
        }

        .copy-btn {
            background: rgba(0,247,255,0.1);
            border: 1px solid rgba(0,247,255,0.2);
            color: var(--cyan);
            padding: 3px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s;
        }
        .copy-btn:hover {
            background: rgba(0,247,255,0.2);
        }

        .msg-bubble code:not(pre code) {
            background: rgba(0,247,255,0.1);
            color: var(--cyan);
            padding: 2px 7px;
            border-radius: 5px;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
        }

        .msg-bubble strong {
            color: var(--cyan);
            font-weight: 700;
        }

        .msg-bubble em {
            color: var(--pink);
        }

        .msg-bubble ul, .msg-bubble ol {
            padding-left: 20px;
            margin: 8px 0;
        }

        .msg-bubble li {
            margin: 4px 0;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 14px 18px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 4px 18px 18px 18px;
            width: fit-content;
        }

        .typing-dot {
            width: 8px; height: 8px;
            background: var(--cyan);
            border-radius: 50%;
            animation: typingBounce 1.4s ease-in-out infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 16px;
            background: var(--cyan);
            margin-left: 2px;
            animation: blink 0.8s step-end infinite;
            vertical-align: middle;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ===== INPUT AREA ===== */
        .input-area {
            padding: 15px 10px 20px;
            background: rgba(10,10,26,0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 10px 10px 10px 18px;
            transition: all 0.3s;
        }
        .input-wrapper:focus-within {
            border-color: var(--cyan);
            box-shadow: 0 0 20px rgba(0,247,255,0.1);
        }

        #userInput {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            resize: none;
            max-height: 120px;
            line-height: 1.5;
        }
        #userInput::placeholder {
            color: var(--text2);
        }

        .send-btn {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
            font-size: 18px;
            color: white;
        }
        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0,247,255,0.3);
        }
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .input-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            padding: 0 5px;
        }

        .input-hint {
            color: var(--text2);
            font-size: 11px;
        }

        .clear-btn {
            background: none;
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text2);
            padding: 4px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s;
        }
        .clear-btn:hover {
            border-color: var(--pink);
            color: var(--pink);
        }

        @media (max-width: 768px) {
            .modi-side, .bapu-side,
            .modi-dialogue, .bapu-dialogue {
                display: none;
            }
            .suggestions-grid {
                grid-template-columns: 1fr;
            }
            .msg-content {
                max-width: 88%;
            }
            .welcome-title {
                font-size: 22px;
            }
        }

        .error-bubble {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
        }

        .history-divider {
            text-align: center;
            color: var(--text2);
            font-size: 11px;
            margin: 15px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .history-divider::before,
        .history-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
    </style>
</head>

<!-- Main Layout -->
<div class="main-layout">

                <button class="suggestion-btn" onclick="sendSuggestion(this)">

                <button class="send-btn" id="sendBtn" onclick="sendMessage()">

            <div class="input-footer">

    </div>

    // ============================================

    // ============================================

    // ============================================
        const SYSTEM_PROMPT = `Tu "Shyam Sir AI" hai — ek EXPERT Python tutor jo students ko DEEP aur DETAILED tarike se padhata hai, bilkul jaise ek best teacher class mein padhata hai.

**💻 Code Example 1: Basic**
\`\`\`python
# Comments Hindi mein
prashant_score = 95
# Explanation of code
\`\`\`

**🔍 Code Explanation:**
- Line 1: [kya kar raha hai]

    // ============================================
    // Chat History (localStorage)
    // ============================================
    let chatHistory = [];

    function loadHistory() {
        const saved = localStorage.getItem('shyamAIHistory');
        if (saved) {
            try {
                chatHistory = JSON.parse(saved);
                if (chatHistory.length > 0) {
                    hideWelcome();
                    const divider = document.createElement('div');
                    divider.className = 'history-divider';
                    divider.textContent = '📚 Purani Chat History';
                    document.getElementById('messagesContainer').appendChild(divider);

                    chatHistory.forEach(msg => {
                        if (msg.role === 'user') {
                            appendMessage('user', msg.content, false);
                        } else if (msg.role === 'assistant') {
                            appendMessage('ai', msg.content, false);
                        }
                    });
                    scrollToBottom();
                }
            } catch(e) {
                console.error('History load error:', e);
                chatHistory = [];
            }
        }
    }

    function saveHistory() {
        if (chatHistory.length > 20) {
            chatHistory = chatHistory.slice(-20);
        }
        localStorage.setItem('shyamAIHistory', JSON.stringify(chatHistory));
    }

    function clearHistory() {
        if (confirm('Bhai, poori chat history delete ho jaayegi! Pakka?')) {
            chatHistory = [];
            localStorage.removeItem('shyamAIHistory');
            document.getElementById('messagesContainer').innerHTML = '';
            showWelcome();
        }
    }

    // ============================================
    // UI Functions
    // ============================================
    function hideWelcome() {
        const ws = document.getElementById('welcomeSection');
        if (ws) ws.style.display = 'none';
    }

    function showWelcome() {
        const ws = document.getElementById('welcomeSection');
        if (ws) ws.style.display = 'block';
    }

    function scrollToBottom() {
        const container = document.getElementById('messagesContainer');
        container.scrollTop = container.scrollHeight;
    }

    function autoResize(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
    }

    function handleKeyDown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    // ============================================
    // Markdown Processing
    // ============================================
    function processMarkdown(text) {
        // Code blocks
        text = text.replace(/```(\w+)?\n?([\s\S]*?)```/g, (match, lang, code) => {
            const language = lang || 'python';
            const escapedCode = code.trim()
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
            return `<div class="code-block-wrapper">
                <div class="code-header">
                    <span class="code-lang">${language}</span>
                    <button class="copy-btn" onclick="copyCode(this)">📋 Copy</button>
                </div>
                <pre><code class="language-${language}">${escapedCode}</code></pre>
            </div>`;
        });

        // Inline code
        text = text.replace(/`([^`]+)`/g, '<code>$1</code>');

        // Bold
        text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

        // Italic
        text = text.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>');

        // Lists
        text = text.replace(/^[\s]*[-*] (.+)$/gm, '<li>$1</li>');
        text = text.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
        text = text.replace(/(<li>.*?<\/li>\s*)+/gs, '<ul>$&</ul>');

        // Line breaks
        text = text.replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>');
        text = '<p>' + text + '</p>';
        text = text.replace(/<p><\/p>/g, '');
        text = text.replace(/<p>(<div class="code-block-wrapper">)/g, '$1');
        text = text.replace(/(<\/div>)<\/p>/g, '$1');
        text = text.replace(/<p>(<ul>)/g, '$1');
        text = text.replace(/(<\/ul>)<\/p>/g, '$1');

        return text;
    }

    function appendMessage(role, text, animate = true) {
        const container = document.getElementById('messagesContainer');

        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}`;

        const avatarDiv = document.createElement('div');
        avatarDiv.className = `msg-avatar ${role === 'ai' ? 'ai-avatar' : 'user-avatar'}`;
        avatarDiv.textContent = role === 'ai' ? '🤖' : '👨‍🎓';

        const contentDiv = document.createElement('div');
        contentDiv.className = 'msg-content';

        const nameDiv = document.createElement('div');
        nameDiv.className = 'msg-name';
        nameDiv.textContent = role === 'ai' ? 'Shyam Sir AI 🤖' : 'Tum 👨‍🎓';

        const bubbleDiv = document.createElement('div');
        bubbleDiv.className = `msg-bubble ${role === 'ai' ? 'ai-bubble' : 'user-bubble'}`;
        bubbleDiv.innerHTML = processMarkdown(text);

        contentDiv.appendChild(nameDiv);
        contentDiv.appendChild(bubbleDiv);
        msgDiv.appendChild(avatarDiv);
        msgDiv.appendChild(contentDiv);
        container.appendChild(msgDiv);

        msgDiv.querySelectorAll('pre code').forEach(block => {
            hljs.highlightElement(block);
        });

        if (animate) scrollToBottom();
        return bubbleDiv;
    }

    function showTypingIndicator() {
        const container = document.getElementById('messagesContainer');

        const msgDiv = document.createElement('div');
        msgDiv.className = 'message ai';
        msgDiv.id = 'typingMsg';

        const avatarDiv = document.createElement('div');
        avatarDiv.className = 'msg-avatar ai-avatar';
        avatarDiv.textContent = '🤖';

        const contentDiv = document.createElement('div');
        contentDiv.className = 'msg-content';

        const nameDiv = document.createElement('div');
        nameDiv.className = 'msg-name';
        nameDiv.textContent = 'Shyam Sir AI 🤖';

        const typingDiv = document.createElement('div');
        typingDiv.className = 'typing-indicator';
        typingDiv.innerHTML = `
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <span style="margin-left:8px; font-size:12px; color: var(--text2);">Soch raha hoon...</span>
        `;

        contentDiv.appendChild(nameDiv);
        contentDiv.appendChild(typingDiv);
        msgDiv.appendChild(avatarDiv);

    }

    function removeTypingIndicator() {
        const typing = document.getElementById('typingMsg');
        if (typing) typing.remove();
    }

    function copyCode(btn) {
        const codeBlock = btn.closest('.code-block-wrapper').querySelector('code');
        const text = codeBlock.innerText;
        navigator.clipboard.writeText(text).then(() => {
            btn.textContent = '✅ Copied!';
            setTimeout(() => btn.textContent = '📋 Copy', 2000);
        });
    }

    function sendSuggestion(btn) {
        const text = btn.querySelector('.suggestion-text').lastChild.textContent.trim();
        document.getElementById('userInput').value = text;
        sendMessage();
    }

    // ============================================
    // MAIN: Send Message with Groq API (Streaming!)
    // ============================================
    let isStreaming = false;

    async function sendMessage() {
        if (isStreaming) return;

        const input = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const userText = input.value.trim();

        if (!userText) return;

        input.value = '';
        input.style.height = 'auto';
        hideWelcome();
        isStreaming = true;
        sendBtn.disabled = true;
        sendBtn.textContent = '⏳';

        appendMessage('user', userText);

        chatHistory.push({
            role: 'user',
            content: userText
        });

        showTypingIndicator();

        try {
            // Groq API messages format
            const messages = [
                { role: 'system', content: SYSTEM_PROMPT },
                ...chatHistory
            ];

            const response = await fetch(GROQ_API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${GROQ_API_KEY}`
                },
                body: JSON.stringify({
                    model: MODEL,
                    messages: messages,
                    temperature: 0.8,
                    max_tokens: 1024,
                    top_p: 0.95,
                    stream: true
                })
            });

            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.error?.message || `API Error: ${response.status}`);
            }

            removeTypingIndicator();

            // Create AI message bubble for streaming
            const container = document.getElementById('messagesContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ai';

            const avatarDiv = document.createElement('div');
            avatarDiv.className = 'msg-avatar ai-avatar';
            avatarDiv.textContent = '🤖';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'msg-content';

            const nameDiv = document.createElement('div');
            nameDiv.className = 'msg-name';
            nameDiv.textContent = 'Shyam Sir AI 🤖';

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'msg-bubble ai-bubble';
            bubbleDiv.innerHTML = '<span class="cursor"></span>';

            contentDiv.appendChild(nameDiv);
            contentDiv.appendChild(bubbleDiv);
            msgDiv.appendChild(avatarDiv);
            msgDiv.appendChild(contentDiv);
            container.appendChild(msgDiv);
            scrollToBottom();

            // Read streaming response (Groq uses OpenAI format SSE)
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let fullText = '';
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';

                for (const line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed || !trimmed.startsWith('data: ')) continue;
                    
                    const data = trimmed.slice(6);
                    if (data === '[DONE]') continue;
                    
                    try {
                        const parsed = JSON.parse(data);
                        const content = parsed.choices?.[0]?.delta?.content || '';
                        if (content) {
                            fullText += content;
                            bubbleDiv.innerHTML = processMarkdown(fullText) + '<span class="cursor"></span>';
                            scrollToBottom();
                        }
                    } catch (e) {
                        // Skip parse errors
                    }
                }
            }

            // Final render without cursor
            bubbleDiv.innerHTML = processMarkdown(fullText);
            bubbleDiv.querySelectorAll('pre code').forEach(block => {
                hljs.highlightElement(block);
            });
            scrollToBottom();

            chatHistory.push({
                role: 'assistant',
                content: fullText
            });
            saveHistory();

            updateModiDialogue();

        } catch (error) {
            removeTypingIndicator();
            console.error('Error:', error);

            const container = document.getElementById('messagesContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ai';
            msgDiv.innerHTML = `
                <div class="msg-avatar ai-avatar">🤖</div>
                <div class="msg-content">
                    <div class="msg-name">Shyam Sir AI 🤖</div>
                    <div class="error-bubble">
                        ⚠️ <strong>Oops! Kuch problem aa gayi bhai...</strong><br><br>
                        <small><strong>Error:</strong> ${error.message}</small><br>
                        <small>💡 Solution: API key check karo, ya thodi der baad try karo!</small>
                    </div>
                </div>
            `;
            container.appendChild(msgDiv);
            scrollToBottom();
        } finally {
            isStreaming = false;
            sendBtn.disabled = false;
            sendBtn.textContent = '➤';
        }
    }

    // ============================================
    // Modi Dialogues (Rotating)
    // ============================================
    const modiDialogues = [
        "Ek sawaal poocho! 🔥",
        "Python seekhna easy hai! 💪",
        "Bhai, code karo! 🚀",
        "Doubt mat rakhna! 🎯",
        "Aage badho! ⚡",
        "Prashant bhi yahi seekha! 😄",
        "AI se daro mat! 🤖",
        "Python = Superpower! 🐍",
        "Groq super fast hai! ⚡"
    ];
    let dialogueIndex = 0;

    function updateModiDialogue() {
        dialogueIndex = (dialogueIndex + 1) % modiDialogues.length;
        const el = document.getElementById('modiDialogue');
        if (el) el.textContent = modiDialogues[dialogueIndex];
    }

    setInterval(updateModiDialogue, 4000);

    // Page Load
    window.onload = function() {
        loadHistory();
    };
</script>
