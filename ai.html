<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutor 🤖 - Code With Shyam</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Caveat:wght@400;600&family=Kalam&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a1a;
            --bg2: #0d0d20;
            --bg3: #111128;
            --cyan: #00f7ff;
            --cyan2: #00c4cc;
            --purple: #7c3aed;
            --pink: #ec4899;
            --green: #10b981;
            --orange: #f97316;
            --card: rgba(255,255,255,0.04);
            --border: rgba(0,247,255,0.15);
            --text: #e2e8f0;
            --text2: #94a3b8;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== BACKGROUND EFFECTS ===== */
        .bg-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }
        .bg-glow-1 {
            width: 400px; height: 400px;
            background: rgba(0,247,255,0.06);
            top: -100px; left: -100px;
        }
        .bg-glow-2 {
            width: 300px; height: 300px;
            background: rgba(124,58,237,0.08);
            bottom: 100px; right: -50px;
        }
        .bg-glow-3 {
            width: 200px; height: 200px;
            background: rgba(236,72,153,0.05);
            top: 50%; left: 50%;
            transform: translate(-50%,-50%);
        }

        /* ===== HEADER ===== */
        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            background: rgba(10,10,26,0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--cyan);
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            transition: all 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .back-btn:hover {
            background: rgba(0,247,255,0.1);
            transform: translateX(-3px);
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-badge {
            background: linear-gradient(135deg, var(--green), #059669);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* ===== MAIN LAYOUT ===== */
        .main-layout {
            display: flex;
            height: 100vh;
            padding-top: 65px;
            position: relative;
            z-index: 1;
        }

        /* ===== SIDE CHARACTERS ===== */
        .side-char {
            width: 120px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 20px;
            position: relative;
        }

        .modi-side {
            position: fixed;
            bottom: 20px;
            right: 8px;
            width: 110px;
            z-index: 50;
        }

        .bapu-side {
            position: fixed;
            bottom: 20px;
            left: 8px;
            width: 100px;
            z-index: 50;
        }

        .modi-img {
            width: 100px;
            animation: modiFloat 3s ease-in-out infinite;
            filter: drop-shadow(0 0 15px rgba(255,165,0,0.5));
        }
        @keyframes modiFloat {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }

        .bapu-img {
            width: 90px;
            animation: bapuFloat 4s ease-in-out infinite;
            opacity: 0.9;
            filter: drop-shadow(0 0 10px rgba(255,215,100,0.3));
        }
        @keyframes bapuFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .modi-dialogue {
            position: fixed;
            bottom: 125px;
            right: 8px;
            background: linear-gradient(135deg, #ff6b00, #ff9500);
            color: white;
            padding: 8px 12px;
            border-radius: 12px 12px 0 12px;
            font-size: 11px;
            font-weight: 700;
            width: 115px;
            text-align: center;
            z-index: 50;
            animation: dialogueFade 4s ease-in-out infinite;
            box-shadow: 0 4px 15px rgba(255,107,0,0.4);
        }

        .bapu-dialogue {
            position: fixed;
            bottom: 115px;
            left: 8px;
            background: linear-gradient(135deg, #d4a843, #f0c060);
            color: #1a0a00;
            padding: 8px 10px;
            border-radius: 12px 12px 12px 0;
            font-size: 10px;
            font-weight: 600;
            width: 110px;
            text-align: center;
            z-index: 50;
            font-family: 'Caveat', cursive;
        }

        @keyframes dialogueFade {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(0.98); }
        }

        /* ===== CHAT AREA ===== */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            padding: 0 10px;
        }

        /* ===== WELCOME SECTION ===== */
        .welcome-section {
            padding: 30px 20px 10px;
            text-align: center;
        }

        .welcome-title {
            font-size: clamp(24px, 4vw, 36px);
            font-weight: 800;
            background: linear-gradient(135deg, var(--cyan), var(--purple), var(--pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .welcome-subtitle {
            color: var(--text2);
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* ===== QUICK SUGGESTIONS ===== */
        .suggestions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        .suggestion-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 15px;
            border-radius: 14px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            text-align: left;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .suggestion-btn:hover {
            background: rgba(0,247,255,0.08);
            border-color: var(--cyan);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,247,255,0.1);
        }
        .suggestion-icon {
            font-size: 20px;
        }
        .suggestion-text {
            line-height: 1.3;
        }
        .suggestion-text strong {
            display: block;
            color: var(--cyan);
            font-size: 12px;
            margin-bottom: 2px;
        }

        /* ===== MESSAGES ===== */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px 10px 20px;
            scroll-behavior: smooth;
        }

        .messages-container::-webkit-scrollbar {
            width: 4px;
        }
        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        /* Message Bubbles */
        .message {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            animation: msgAppear 0.4s ease-out;
        }

        @keyframes msgAppear {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            font-weight: 700;
        }

        .ai-avatar {
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            box-shadow: 0 0 15px rgba(0,247,255,0.3);
        }

        .user-avatar {
            background: linear-gradient(135deg, var(--orange), var(--pink));
            box-shadow: 0 0 15px rgba(249,115,22,0.3);
        }

        .msg-content {
            max-width: 75%;
        }

        .msg-name {
            font-size: 11px;
            color: var(--text2);
            margin-bottom: 5px;
            font-weight: 600;
        }

        .message.user .msg-name {
            text-align: right;
        }

        .msg-bubble {
            padding: 14px 18px;
            border-radius: 18px;
            line-height: 1.6;
            font-size: 14px;
        }

        .ai-bubble {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 4px 18px 18px 18px;
        }

        .user-bubble {
            background: linear-gradient(135deg, rgba(0,247,255,0.15), rgba(124,58,237,0.15));
            border: 1px solid rgba(0,247,255,0.25);
            border-radius: 18px 4px 18px 18px;
        }

        /* Code blocks inside messages */
        .msg-bubble pre {
            margin: 12px 0;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .msg-bubble pre code {
            font-family: 'Fira Code', monospace !important;
            font-size: 13px !important;
        }

        .code-header {
            background: #1a1a2e;
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .code-lang {
            color: var(--cyan);
            font-size: 12px;
            font-weight: 600;
            font-family: 'Fira Code', monospace;
        }

        .copy-btn {
            background: rgba(0,247,255,0.1);
            border: 1px solid rgba(0,247,255,0.2);
            color: var(--cyan);
            padding: 3px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s;
        }
        .copy-btn:hover {
            background: rgba(0,247,255,0.2);
        }

        /* Inline code */
        .msg-bubble code:not(pre code) {
            background: rgba(0,247,255,0.1);
            color: var(--cyan);
            padding: 2px 7px;
            border-radius: 5px;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
        }

        /* Bold, lists etc */
        .msg-bubble strong {
            color: var(--cyan);
            font-weight: 700;
        }

        .msg-bubble em {
            color: var(--pink);
        }

        .msg-bubble ul, .msg-bubble ol {
            padding-left: 20px;
            margin: 8px 0;
        }

        .msg-bubble li {
            margin: 4px 0;
        }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 14px 18px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 4px 18px 18px 18px;
            width: fit-content;
        }

        .typing-dot {
            width: 8px; height: 8px;
            background: var(--cyan);
            border-radius: 50%;
            animation: typingBounce 1.4s ease-in-out infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        /* ===== STREAMING CURSOR ===== */
        .cursor {
            display: inline-block;
            width: 2px;
            height: 16px;
            background: var(--cyan);
            margin-left: 2px;
            animation: blink 0.8s step-end infinite;
            vertical-align: middle;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ===== INPUT AREA ===== */
        .input-area {
            padding: 15px 10px 20px;
            background: rgba(10,10,26,0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 10px 10px 10px 18px;
            transition: all 0.3s;
        }
        .input-wrapper:focus-within {
            border-color: var(--cyan);
            box-shadow: 0 0 20px rgba(0,247,255,0.1);
        }

        #userInput {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            resize: none;
            max-height: 120px;
            line-height: 1.5;
        }
        #userInput::placeholder {
            color: var(--text2);
        }

        .send-btn {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
            font-size: 18px;
        }
        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0,247,255,0.3);
        }
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .input-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            padding: 0 5px;
        }

        .input-hint {
            color: var(--text2);
            font-size: 11px;
        }

        .clear-btn {
            background: none;
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text2);
            padding: 4px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s;
        }
        .clear-btn:hover {
            border-color: var(--pink);
            color: var(--pink);
        }

        /* ===== MOBILE RESPONSIVE ===== */
        @media (max-width: 768px) {
            .modi-side, .bapu-side,
            .modi-dialogue, .bapu-dialogue {
                display: none;
            }
            .suggestions-grid {
                grid-template-columns: 1fr;
            }
            .msg-content {
                max-width: 88%;
            }
            .welcome-title {
                font-size: 22px;
            }
        }

        /* ===== ERROR MESSAGE ===== */
        .error-bubble {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ===== HISTORY BADGE ===== */
        .history-info {
            text-align: center;
            color: var(--text2);
            font-size: 11px;
            padding: 8px;
            margin-bottom: 10px;
        }

        .history-divider {
            text-align: center;
            color: var(--text2);
            font-size: 11px;
            margin: 15px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .history-divider::before,
        .history-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
    </style>
</head>
<body>

<!-- Background Glows -->
<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>
<div class="bg-glow bg-glow-3"></div>

<!-- Header -->
<header class="header">
    <div class="header-left">
        <a href="index.html" class="back-btn">← Wapas</a>
        <span class="header-title">🤖 AI Tutor</span>
    </div>
    <div class="header-badge">
        <span>●</span> Online
    </div>
</header>

<!-- Modi Ji (Right Side) -->
<div class="modi-dialogue" id="modiDialogue">
    Bhai, kuch bhi poocho! 🔥
</div>
<div class="modi-side">
    <img src="modi.png" alt="Modi Ji" class="modi-img"
         onerror="this.style.display='none'">
</div>

<!-- Bapu Ji (Left Side) -->
<div class="bapu-dialogue">
    Seekhte raho, beta! 🙏
</div>
<div class="bapu-side">
    <img src="bapu.png" alt="Bapu Ji" class="bapu-img"
         onerror="this.style.display='none'">
</div>

<!-- Main Layout -->
<div class="main-layout">
    <div class="chat-area">

        <!-- Welcome + Suggestions (sirf tab dikhega jab koi message nahi) -->
        <div class="welcome-section" id="welcomeSection">
            <div class="welcome-title">🤖 AI Doubt Solver</div>
            <div class="welcome-subtitle">
                Koi bhi Python doubt poocho — Hindi mein simple explanation milega! 🐍
            </div>

            <div class="suggestions-grid">
                <button class="suggestion-btn" onclick="sendSuggestion(this)">
                    <span class="suggestion-icon">🔄</span>
                    <span class="suggestion-text">
                        <strong>Loops</strong>
                        for loop kaise kaam karta hai?
                    </span>
                </button>
                <button class="suggestion-btn" onclick="sendSuggestion(this)">
                    <span class="suggestion-icon">📦</span>
                    <span class="suggestion-text">
                        <strong>Functions</strong>
                        Function kya hota hai? Example do
                    </span>
                </button>
                <button class="suggestion-btn" onclick="sendSuggestion(this)">
                    <span class="suggestion-icon">🔢</span>
                    <span class="suggestion-text">
                        <strong>Data Types</strong>
                        int, float, string explain karo
                    </span>
                </button>
                <button class="suggestion-btn" onclick="sendSuggestion(this)">
                    <span class="suggestion-icon">⚡</span>
                    <span class="suggestion-text">
                        <strong>Operators</strong>
                        Logical operators samjhao
                    </span>
                </button>
                <button class="suggestion-btn" onclick="sendSuggestion(this)">
                    <span class="suggestion-icon">📋</span>
                    <span class="suggestion-text">
                        <strong>Lists</strong>
                        List kya hoti hai? Kaise use karein?
                    </span>
                </button>
                <button class="suggestion-btn" onclick="sendSuggestion(this)">
                    <span class="suggestion-icon">🔍</span>
                    <span class="suggestion-text">
                        <strong>if-else</strong>
                        Conditions kaise likhte hain?
                    </span>
                </button>
            </div>
        </div>

        <!-- Messages -->
        <div class="messages-container" id="messagesContainer">
            <!-- Messages yahan aayenge -->
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea
                    id="userInput"
                    placeholder="Python ka koi bhi sawaal poocho... 🐍"
                    rows="1"
                    onkeydown="handleKeyDown(event)"
                    oninput="autoResize(this)"
                ></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    ➤
                </button>
            </div>
            <div class="input-footer">
                <span class="input-hint">⌨️ Enter = Send | Shift+Enter = New line</span>
                <button class="clear-btn" onclick="clearHistory()">🗑️ Clear Chat</button>
            </div>
        </div>

    </div>
</div>

<script>
    // ============================================
    // 🔑 APNI API KEY YAHAN DAALO
    // ============================================
    const GEMINI_API_KEY = "YOUR_API_KEY_HERE";
    // ============================================

    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:streamGenerateContent?key=${GEMINI_API_KEY}&alt=sse`;

    // System prompt - AI ki personality define karta hai
    const SYSTEM_PROMPT = `Tu "Shyam Sir AI" hai — ek dost jaisa Python tutor jo students ko bilkul simple aur mast tarike se padhata hai.

TERI PERSONALITY:
- Naam: Shyam Sir AI 🤖
- Style: Friendly, motivating, enthusiastic
- Language: Hinglish (Hindi + English mix) — bilkul natural, jaise dost baat karta ho
- Emojis: Hamesha use kar — iske bina answer adhoora hai!
- Tone: Encouraging, kabhi scold mat kar

IMPORTANT RULES:
1. SHORT aur CRISP answers de — zyada lamba mat likho
2. Hamesha real Python CODE examples de with classmate names
3. Classmate names use kar: Prashant, Aham, Aditya, Nishant (aur kabhi kabhi Babita Mam)
4. Complex cheezein real life se compare karke samjhao
5. Har answer mein thoda motivation zaroor daal
6. Sirf Python/programming questions answer kar. Agar koi Python se bahar poocha, politely bol "Bhai, main sirf Python ka expert hoon! 😄"

ANSWER FORMAT:
- Pehle ek line mein SIMPLE explanation
- Phir code example (agar relevant ho)
- Last mein ek motivating line ya fun fact

CODE EXAMPLES STYLE:
\`\`\`python
# Example: Classmate ka naam use karo
prashant_score = 95
if prashant_score > 90:
    print("Prashant ne top kiya! 🎉")
\`\`\`

YAD RAKH: Tu bahut friendly hai, students se darr nahi lagta. Woh khul ke doubt pooch sakते hain!`;

    // ============================================
    // Chat History (localStorage)
    // ============================================
    let chatHistory = [];

    function loadHistory() {
        const saved = localStorage.getItem('aiTutorHistory');
        if (saved) {
            chatHistory = JSON.parse(saved);
            if (chatHistory.length > 0) {
                hideWelcome();
                // Divider dikhao
                const divider = document.createElement('div');
                divider.className = 'history-divider';
                divider.textContent = '📚 Purani Chat History';
                document.getElementById('messagesContainer').appendChild(divider);

                chatHistory.forEach(msg => {
                    if (msg.role === 'user') {
                        appendMessage('user', msg.parts[0].text, false);
                    } else {
                        appendMessage('ai', msg.parts[0].text, false);
                    }
                });
                scrollToBottom();
            }
        }
    }

    function saveHistory() {
        // Sirf last 20 messages save karo
        if (chatHistory.length > 20) {
            chatHistory = chatHistory.slice(-20);
        }
        localStorage.setItem('aiTutorHistory', JSON.stringify(chatHistory));
    }

    function clearHistory() {
        if (confirm('Bhai, poori chat history delete ho jaayegi! Pakka?')) {
            chatHistory = [];
            localStorage.removeItem('aiTutorHistory');
            document.getElementById('messagesContainer').innerHTML = '';
            showWelcome();
        }
    }

    // ============================================
    // UI Functions
    // ============================================
    function hideWelcome() {
        const ws = document.getElementById('welcomeSection');
        if (ws) {
            ws.style.display = 'none';
        }
    }

    function showWelcome() {
        const ws = document.getElementById('welcomeSection');
        if (ws) {
            ws.style.display = 'block';
        }
    }

    function scrollToBottom() {
        const container = document.getElementById('messagesContainer');
        container.scrollTop = container.scrollHeight;
    }

    function autoResize(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
    }

    function handleKeyDown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    // ============================================
    // Message Rendering
    // ============================================
    function processMarkdown(text) {
        // Code blocks process karo
        text = text.replace(/```(\w+)?\n([\s\S]*?)```/g, (match, lang, code) => {
            const language = lang || 'python';
            const escapedCode = code.trim()
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
            return `<div class="code-block-wrapper">
                <div class="code-header">
                    <span class="code-lang">${language}</span>
                    <button class="copy-btn" onclick="copyCode(this)">📋 Copy</button>
                </div>
                <pre><code class="language-${language}">${escapedCode}</code></pre>
            </div>`;
        });

        // Inline code
        text = text.replace(/`([^`]+)`/g, '<code>$1</code>');

        // Bold
        text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

        // Italic
        text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');

        // Lists
        text = text.replace(/^[\s]*[-*] (.+)$/gm, '<li>$1</li>');
        text = text.replace(/((<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');

        // Numbered lists
        text = text.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');

        // Line breaks
        text = text.replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>');
        text = '<p>' + text + '</p>';
        text = text.replace(/<p><\/p>/g, '');

        return text;
    }

    function appendMessage(role, text, animate = true) {
        const container = document.getElementById('messagesContainer');

        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}`;

        const avatarDiv = document.createElement('div');
        avatarDiv.className = `msg-avatar ${role === 'ai' ? 'ai-avatar' : 'user-avatar'}`;
        avatarDiv.textContent = role === 'ai' ? '🤖' : '👨‍🎓';

        const contentDiv = document.createElement('div');
        contentDiv.className = 'msg-content';

        const nameDiv = document.createElement('div');
        nameDiv.className = 'msg-name';
        nameDiv.textContent = role === 'ai' ? 'Shyam Sir AI 🤖' : 'Tum 👨‍🎓';

        const bubbleDiv = document.createElement('div');
        bubbleDiv.className = `msg-bubble ${role === 'ai' ? 'ai-bubble' : 'user-bubble'}`;
        bubbleDiv.innerHTML = processMarkdown(text);

        contentDiv.appendChild(nameDiv);
        contentDiv.appendChild(bubbleDiv);
        msgDiv.appendChild(avatarDiv);
        msgDiv.appendChild(contentDiv);
        container.appendChild(msgDiv);

        // Highlight code blocks
        msgDiv.querySelectorAll('pre code').forEach(block => {
            hljs.highlightElement(block);
        });

        if (animate) scrollToBottom();
        return bubbleDiv;
    }

    function showTypingIndicator() {
        const container = document.getElementById('messagesContainer');

        const msgDiv = document.createElement('div');
        msgDiv.className = 'message ai';
        msgDiv.id = 'typingMsg';

        const avatarDiv = document.createElement('div');
        avatarDiv.className = 'msg-avatar ai-avatar';
        avatarDiv.textContent = '🤖';

        const contentDiv = document.createElement('div');
        contentDiv.className = 'msg-content';

        const nameDiv = document.createElement('div');
        nameDiv.className = 'msg-name';
        nameDiv.textContent = 'Shyam Sir AI 🤖';

        const typingDiv = document.createElement('div');
        typingDiv.className = 'typing-indicator';
        typingDiv.innerHTML = `
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <span style="margin-left:8px; font-size:12px; color: var(--text2);">Soch raha hoon...</span>
        `;

        contentDiv.appendChild(nameDiv);
        contentDiv.appendChild(typingDiv);
        msgDiv.appendChild(avatarDiv);
        msgDiv.appendChild(contentDiv);
        container.appendChild(msgDiv);
        scrollToBottom();
    }

    function removeTypingIndicator() {
        const typing = document.getElementById('typingMsg');
        if (typing) typing.remove();
    }

    function copyCode(btn) {
        const codeBlock = btn.closest('.code-block-wrapper').querySelector('code');
        const text = codeBlock.innerText;
        navigator.clipboard.writeText(text).then(() => {
            btn.textContent = '✅ Copied!';
            setTimeout(() => btn.textContent = '📋 Copy', 2000);
        });
    }

    // ============================================
    // Suggestion Button Click
    // ============================================
    function sendSuggestion(btn) {
        const text = btn.querySelector('.suggestion-text').lastChild.textContent.trim();
        document.getElementById('userInput').value = text;
        sendMessage();
    }

    // ============================================
    // MAIN: Send Message + Streaming
    // ============================================
    let isStreaming = false;

    async function sendMessage() {
        if (isStreaming) return;

        const input = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const userText = input.value.trim();

        if (!userText) return;
        if (GEMINI_API_KEY === 'AQ.Ab8RN6Kai-vPybB5CHq6pF4cOER2yxltVleY6VvgtIdvpWrPWA') {
            alert('⚠️ Bhai! Pehle apni Gemini API Key daalo ai.html mein!');
            return;
        }

        // UI clear karo
        input.value = '';
        input.style.height = 'auto';
        hideWelcome();
        isStreaming = true;
        sendBtn.disabled = true;
        sendBtn.textContent = '⏳';

        // User message dikhao
        appendMessage('user', userText);

        // History mein add karo
        chatHistory.push({
            role: 'user',
            parts: [{ text: userText }]
        });

        // Typing indicator
        showTypingIndicator();

        try {
            // API Request banao
            const messages = [
                // System prompt as first user message (Gemini ka tarika)
                {
                    role: 'user',
                    parts: [{ text: SYSTEM_PROMPT }]
                },
                {
                    role: 'model',
                    parts: [{ text: 'Bilkul bhai! Main Shyam Sir AI hoon — tera Python dost! 🤖🔥 Poocho jo bhi doubt hai!' }]
                },
                ...chatHistory
            ];

            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: messages,
                    generationConfig: {
                        temperature: 0.8,
                        maxOutputTokens: 1024,
                        topP: 0.95,
                    }
                })
            });

            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.error?.message || 'API Error');
            }

            // Typing indicator hatao, AI bubble banao
            removeTypingIndicator();

            // Streaming response handle karo
            const container = document.getElementById('messagesContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ai';

            const avatarDiv = document.createElement('div');
            avatarDiv.className = 'msg-avatar ai-avatar';
            avatarDiv.textContent = '🤖';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'msg-content';

            const nameDiv = document.createElement('div');
            nameDiv.className = 'msg-name';
            nameDiv.textContent = 'Shyam Sir AI 🤖';

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'msg-bubble ai-bubble';
            bubbleDiv.innerHTML = '<span class="cursor"></span>';

            contentDiv.appendChild(nameDiv);
            contentDiv.appendChild(bubbleDiv);
            msgDiv.appendChild(avatarDiv);
            msgDiv.appendChild(contentDiv);
            container.appendChild(msgDiv);
            scrollToBottom();

            // SSE Stream read karo
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let fullText = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value);
                const lines = chunk.split('\n');

                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        const data = line.slice(6).trim();
                        if (data === '[DONE]') continue;
                        try {
                            const parsed = JSON.parse(data);
                            const text = parsed.candidates?.[0]?.content?.parts?.[0]?.text || '';
                            if (text) {
                                fullText += text;
                                // Live update
                                bubbleDiv.innerHTML = processMarkdown(fullText) + '<span class="cursor"></span>';
                                scrollToBottom();
                            }
                        } catch (e) {
                            // Parse error skip karo
                        }
                    }
                }
            }

            // Final render (cursor hatao)
            bubbleDiv.innerHTML = processMarkdown(fullText);
            bubbleDiv.querySelectorAll('pre code').forEach(block => {
                hljs.highlightElement(block);
            });
            scrollToBottom();

            // History mein AI response save karo
            chatHistory.push({
                role: 'model',
                parts: [{ text: fullText }]
            });
            saveHistory();

            // Modi dialogue update karo
            updateModiDialogue();

        } catch (error) {
            removeTypingIndicator();
            console.error('Error:', error);

            // Error message dikhao
            const container = document.getElementById('messagesContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ai';
            msgDiv.innerHTML = `
                <div class="msg-avatar ai-avatar">🤖</div>
                <div class="msg-content">
                    <div class="msg-name">Shyam Sir AI 🤖</div>
                    <div class="error-bubble">
                        ⚠️ Oops! Kuch problem aa gayi bhai...<br>
                        <small>${error.message}</small><br>
                        <small>API key check karo ya thodi der baad try karo!</small>
                    </div>
                </div>
            `;
            container.appendChild(msgDiv);
            scrollToBottom();
        } finally {
            isStreaming = false;
            sendBtn.disabled = false;
            sendBtn.textContent = '➤';
        }
    }

    // ============================================
    // Modi Dialogues
    // ============================================
    const modiDialogues = [
        "Ek sawaal poocho! 🔥",
        "Python seekhna easy hai! 💪",
        "Bhai, code karo! 🚀",
        "Doubt mat rakhna! 🎯",
        "Aage badho! Seekhte raho! ⚡",
        "Prashant bhi yahi seekha! 😄",
        "AI se daro mat! 🤖",
        "Python = Superpower! 🐍",
    ];
    let dialogueIndex = 0;

    function updateModiDialogue() {
        dialogueIndex = (dialogueIndex + 1) % modiDialogues.length;
        const el = document.getElementById('modiDialogue');
        if (el) el.textContent = modiDialogues[dialogueIndex];
    }

    setInterval(updateModiDialogue, 4000);

    // ============================================
    // Page Load
    // ============================================
    window.onload = function() {
        loadHistory();
    };
</script>
