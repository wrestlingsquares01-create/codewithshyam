<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel | Code With #Shyam</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0a1a;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }

    .container { max-width: 900px; margin: 0 auto; }

    .login-screen {
      max-width: 400px;
      margin: 100px auto;
      background: #111133;
      border-radius: 15px;
      padding: 40px 30px;
      text-align: center;
      border: 2px solid #ff6600;
    }

    .login-screen h1 {
      color: #ff6600;
      margin-bottom: 10px;
      font-size: 1.8rem;
    }

    .login-screen p {
      color: #aaa;
      margin-bottom: 25px;
      font-size: 0.9rem;
    }

    .login-input {
      width: 100%;
      padding: 14px 15px;
      background: #0a0a1a;
      border: 2px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      margin-bottom: 15px;
      text-align: center;
      letter-spacing: 3px;
    }

    .login-input:focus { border-color: #ff6600; }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ff6600, #ff0066);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(255, 102, 0, 0.5);
    }

    .error {
      color: #ff4444;
      margin-top: 10px;
      font-size: 0.9rem;
      display: none;
    }

    .admin-dashboard { display: none; }
    .admin-dashboard.active { display: block; }

    .admin-header {
      background: linear-gradient(135deg, #ff6600, #ff0066);
      color: #fff;
      padding: 20px 25px;
      border-radius: 15px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .admin-header h1 { font-size: 1.5rem; }
    .admin-header p { font-size: 0.9rem; opacity: 0.9; }

    .logout-btn {
      padding: 8px 20px;
      background: transparent;
      border: 2px solid #fff;
      color: #fff;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .admin-notice {
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid #ffd700;
      color: #ffd700;
      padding: 12px 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      text-align: center;
      font-size: 0.9rem;
    }

    .chat-container {
      background: #111133;
      border-radius: 15px;
      overflow: hidden;
      border: 2px solid #ff6600;
    }

    .chat-header {
      background: linear-gradient(135deg, #00f7ff, #0088ff);
      color: #000;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .group-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
    }

    .chat-header-info h3 { font-size: 1.2rem; }
    .chat-header-info span { font-size: 0.85rem; opacity: 0.85; }

    .online-badge {
      background: rgba(0,0,0,0.2);
      padding: 5px 12px;
      border-radius: 15px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #00ff00;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .chat-body {
      height: 500px;
      overflow-y: auto;
      padding: 20px;
      background: #0a0a1a;
    }

    .chat-body::-webkit-scrollbar { width: 8px; }
    .chat-body::-webkit-scrollbar-thumb {
      background: #ff660044;
      border-radius: 10px;
    }

    .date-separator {
      text-align: center;
      margin: 15px 0;
      color: #666;
      font-size: 0.8rem;
    }

    .date-separator span {
      background: #0a0a1a;
      padding: 5px 15px;
      border-radius: 12px;
      border: 1px solid #333;
    }

    .message {
      margin-bottom: 15px;
      display: flex;
      animation: messageIn 0.3s ease;
      gap: 10px;
      position: relative;
    }

    @keyframes messageIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.own { flex-direction: row-reverse; }

    .message-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
      flex-shrink: 0;
      font-size: 1rem;
    }

    .message-content { 
      max-width: 70%; 
      position: relative;
    }

    .message.own .message-content {
      align-items: flex-end;
      display: flex;
      flex-direction: column;
    }

    .message-info {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px;
      font-size: 0.8rem;
      flex-wrap: wrap;
    }

    .message-name { font-weight: bold; color: #00f7ff; }
    .message.own .message-name { color: #ffd700; }
    .message-class { color: #666; font-size: 0.75rem; }

    .admin-badge {
      background: linear-gradient(135deg, #ffd700, #ff6600);
      color: #000;
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 0.7rem;
      font-weight: bold;
    }

    .message-bubble {
      padding: 10px 15px;
      border-radius: 15px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
      background: #1a1a3e;
      color: #fff;
      border-bottom-left-radius: 4px;
    }

    .message.own .message-bubble {
      background: linear-gradient(135deg, #ffd700, #ff6600);
      color: #000;
      border-bottom-right-radius: 4px;
      border-bottom-left-radius: 15px;
      border: 2px solid #ffaa00;
    }

    .message-bubble.deleted {
      background: #2a2a2a !important;
      color: #666 !important;
      font-style: italic;
      border: 1px dashed #555 !important;
    }

    .message-time { font-size: 0.7rem; color: #666; margin-top: 3px; }
    .message.own .message-time { text-align: right; }

    /* Admin Delete Button - Har message pe dikhega */
    .admin-delete-btn {
      background: linear-gradient(135deg, #ff4444, #cc0000);
      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 15px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: bold;
      margin-top: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(255, 68, 68, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .admin-delete-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(255, 68, 68, 0.6);
    }

    .chat-input-area {
      padding: 15px;
      background: #111133;
      display: flex;
      gap: 10px;
      border-top: 1px solid #333;
    }

    .chat-input {
      flex: 1;
      padding: 12px 15px;
      background: #0a0a1a;
      border: 1px solid #ff6600;
      border-radius: 25px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .send-btn {
      padding: 12px 25px;
      background: linear-gradient(135deg, #ffd700, #ff6600);
      border: none;
      color: #000;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 25px;
      transition: all 0.3s ease;
    }

    .send-btn:hover { transform: scale(1.05); }

    @media (max-width: 600px) {
      .chat-body { height: 400px; }
      .message-content { max-width: 80%; }
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="login-screen" id="loginScreen">
      <h1>🔐 Admin Access</h1>
      <p>Shyam Sir login karo</p>
      <input type="password" class="login-input" id="passwordInput" placeholder="Password" onkeypress="if(event.key==='Enter') checkPassword()" />
      <button class="login-btn" onclick="checkPassword()">Login as Admin 👑</button>
      <div class="error" id="errorMsg">❌ Galat password!</div>
    </div>

    <div class="admin-dashboard" id="adminDashboard">
      <div class="admin-header">
        <div>
          <h1>👑 Admin Mode — Shyam Sir</h1>
          <p>Tera message admin badge ke saath dikhega</p>
        </div>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>

      <div class="admin-notice">
        ⚡ <strong>Admin Power:</strong> Tu KOI BHI message delete kar sakta hai — har message ke neeche 🗑️ Delete button dikhega!
      </div>

      <div class="chat-container">
        <div class="chat-header">
          <div class="chat-header-left">
            <div class="group-icon">🐍</div>
            <div class="chat-header-info">
              <h3>Python Learners Group</h3>
              <span id="memberCount">Loading...</span>
            </div>
          </div>
          <div class="online-badge">
            <span class="status-dot"></span>
            <span id="onlineCount">Live</span>
          </div>
        </div>

        <div class="chat-body" id="chatBody">
          <div style="text-align:center; color:#666; padding:20px;">Loading...</div>
        </div>

        <div class="chat-input-area">
          <input type="text" class="chat-input" id="chatInput" placeholder="Admin ke roop mein message likho..." maxlength="500" onkeypress="if(event.key==='Enter') sendMessage()" />
          <button class="send-btn" onclick="sendMessage()">Send 👑</button>
        </div>
      </div>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, set, onDisconnect, update, remove } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC8QH1r20GnrSpY9jfxaZKbxSX7OOwA5AY",
      authDomain: "codewithshyam-86c96.firebaseapp.com",
      databaseURL: "https://codewithshyam-86c96-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "codewithshyam-86c96",
      storageBucket: "codewithshyam-86c96.firebasestorage.app",
      messagingSenderId: "275205226924",
      appId: "1:275205226924:web:81d1961f413fa6ac4e3a09"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ⚠️ APNA PASSWORD YAHAN DAAL!
    const ADMIN_PASSWORD = "shyam@123";

    const adminId = 'shyam_sir_admin';
    const adminName = 'Shyam Sir';

    window.checkPassword = function() {
      const pass = document.getElementById('passwordInput').value;
      if (pass === ADMIN_PASSWORD) {
        localStorage.setItem('adminLoggedIn', 'true');
        showDashboard();
      } else {
        document.getElementById('errorMsg').style.display = 'block';
        document.getElementById('passwordInput').value = '';
      }
    };

    window.logout = function() {
      localStorage.removeItem('adminLoggedIn');
      location.reload();
    };

    if (localStorage.getItem('adminLoggedIn') === 'true') {
      showDashboard();
    }

    function showDashboard() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('adminDashboard').classList.add('active');
      loadCommunityChat();
      trackAdminOnline();
    }

    window.sendMessage = function() {
      const input = document.getElementById('chatInput');
      const message = input.value.trim();
      if (!message) return;

      const messagesRef = ref(db, 'community/messages');
      push(messagesRef, {
        text: message,
        senderName: adminName,
        senderClass: 'Teacher',
        senderId: adminId,
        isAdmin: true,
        deleted: false,
        timestamp: Date.now()
      });

      input.value = '';
    };

    // ===== ADMIN CAN DELETE ANY MESSAGE =====
    window.deleteAnyMessage = function(msgKey, senderName) {
      if (!confirm(`Admin power use karke "${senderName}" ka ye message delete karna hai? 🗑️`)) return;
      
      const msgRef = ref(db, 'community/messages/' + msgKey);
      update(msgRef, {
        deleted: true,
        text: '',
        deletedBy: 'admin'
      });
    };

    // ===== PERMANENTLY DELETE (Complete remove) =====
    window.permanentDelete = function(msgKey) {
      if (!confirm('⚠️ PERMANENTLY delete karna hai? Ye database se completely hat jayega!')) return;
      
      const msgRef = ref(db, 'community/messages/' + msgKey);
      remove(msgRef);
    };

    const avatarColors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#6c5ce7', '#a29bfe', '#fd79a8', '#00b894'];

    function getAvatarColor(name) {
      const index = name.charCodeAt(0) % avatarColors.length;
      return avatarColors[index];
    }

    function loadCommunityChat() {
      const messagesRef = ref(db, 'community/messages');
      onValue(messagesRef, (snapshot) => {
        const chatBody = document.getElementById('chatBody');
        chatBody.innerHTML = '';

        const data = snapshot.val();
        if (!data) {
          chatBody.innerHTML = '<div style="text-align:center; color:#666; padding:40px;">Community abhi khali hai!</div>';
          return;
        }

        const messages = Object.entries(data).map(([key, msg]) => ({
          ...msg,
          _key: key
        })).sort((a, b) => a.timestamp - b.timestamp);

        let lastDate = '';

        messages.forEach(msg => {
          const msgDate = new Date(msg.timestamp).toLocaleDateString('en-IN');
          if (msgDate !== lastDate) {
            const separator = document.createElement('div');
            separator.className = 'date-separator';
            separator.innerHTML = `<span>📅 ${msgDate}</span>`;
            chatBody.appendChild(separator);
            lastDate = msgDate;
          }
          addMessage(msg);
        });

        chatBody.scrollTop = chatBody.scrollHeight;
      });
    }

    function addMessage(msg) {
      const chatBody = document.getElementById('chatBody');
      const messageDiv = document.createElement('div');
      const isOwn = msg.senderId === adminId;
      const isAdmin = msg.isAdmin === true;
      const isDeleted = msg.deleted === true;

      let className = 'message';
      if (isOwn) className += ' own';
      messageDiv.className = className;

      const time = new Date(msg.timestamp);
      const timeStr = time.getHours().toString().padStart(2,'0') + ':' + time.getMinutes().toString().padStart(2,'0');

      const avatarLetter = (msg.senderName || 'U')[0].toUpperCase();
      const avatarColor = isAdmin ? '#ffd700' : getAvatarColor(msg.senderName || 'User');

      const bubbleContent = isDeleted 
        ? '<div class="message-bubble deleted">🗑️ Message deleted</div>'
        : `<div class="message-bubble">${escapeHtml(msg.text)}</div>`;

      // Admin ke pass DELETE + PERMANENT DELETE dono option
      let adminActions = '';
      if (!isDeleted) {
        adminActions = `
          <button class="admin-delete-btn" onclick="deleteAnyMessage('${msg._key}', '${escapeHtml(msg.senderName || 'Unknown').replace(/'/g, "\\'")}')">
            🗑️ Delete
          </button>
        `;
      } else {
        adminActions = `
          <button class="admin-delete-btn" onclick="permanentDelete('${msg._key}')" style="background: linear-gradient(135deg, #666, #333);">
            ❌ Permanent Delete
          </button>
        `;
      }

      messageDiv.innerHTML = `
        <div class="message-avatar" style="background: ${avatarColor};">${avatarLetter}</div>
        <div class="message-content">
          <div class="message-info">
            <span class="message-name">${escapeHtml(msg.senderName || 'Unknown')}</span>
            ${isAdmin ? '<span class="admin-badge">👑 SHYAM SIR</span>' : `<span class="message-class">${escapeHtml(msg.senderClass || '')}</span>`}
          </div>
          ${bubbleContent}
          <div class="message-time">${timeStr}</div>
          ${adminActions}
        </div>
      `;

      chatBody.appendChild(messageDiv);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function trackAdminOnline() {
      const userStatusRef = ref(db, 'community/online/' + adminId);
      set(userStatusRef, {
        name: adminName,
        class: 'Teacher',
        isAdmin: true,
        lastSeen: Date.now()
      });

      onDisconnect(userStatusRef).remove();

      const onlineRef = ref(db, 'community/online');
      onValue(onlineRef, (snapshot) => {
        const data = snapshot.val();
        const count = data ? Object.keys(data).length : 0;
        document.getElementById('onlineCount').textContent = count + ' online';
        document.getElementById('memberCount').textContent = count + ' members active';
      });

      setInterval(() => {
        set(userStatusRef, {
          name: adminName,
          class: 'Teacher',
          isAdmin: true,
          lastSeen: Date.now()
        });
      }, 30000);
    }
  </script>
</body>
</html>
