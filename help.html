<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat with Shyam Sir | Code With #Shyam</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0a1a;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }

    .container { max-width: 700px; margin: 0 auto; }

    .header {
      text-align: center;
      padding: 25px 20px;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      border-radius: 15px;
      border: 1px solid #00f7ff33;
    }

    .header h1 {
      font-size: 1.8rem;
      color: #00f7ff;
      text-shadow: 0 0 10px rgba(0, 247, 255, 0.5);
      margin-bottom: 5px;
    }

    .header p { color: #aaa; font-size: 0.95rem; }
    .header .brand { color: #fff; font-weight: bold; margin-top: 5px; }

    /* Name Entry Screen */
    .name-screen {
      background: #111133;
      border-radius: 15px;
      padding: 40px 30px;
      text-align: center;
      border: 1px solid #00f7ff33;
    }

    .name-screen h2 {
      color: #00f7ff;
      margin-bottom: 20px;
      font-size: 1.5rem;
    }

    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .input-group label {
      display: block;
      color: #aaa;
      margin-bottom: 8px;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .input-group input {
      width: 100%;
      padding: 12px 15px;
      background: #0a0a1a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .input-group input:focus { border-color: #00f7ff; }

    .start-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #00f7ff, #0088ff);
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(0, 247, 255, 0.5);
    }

    /* Chat Interface */
    .chat-container {
      background: #111133;
      border-radius: 15px;
      overflow: hidden;
      border: 1px solid #00f7ff33;
      display: none;
    }

    .chat-container.active { display: block; }

    .chat-header {
      background: linear-gradient(135deg, #00f7ff, #0088ff);
      color: #000;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .chat-avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: #00f7ff;
    }

    .chat-header-info h3 { font-size: 1.1rem; margin-bottom: 2px; }
    .chat-header-info span { font-size: 0.8rem; opacity: 0.8; }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #00ff00;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .chat-body {
      height: 400px;
      overflow-y: auto;
      padding: 20px;
      background: #0a0a1a;
    }

    .chat-body::-webkit-scrollbar { width: 6px; }
    .chat-body::-webkit-scrollbar-thumb {
      background: #00f7ff44;
      border-radius: 10px;
    }

    .message {
      margin-bottom: 15px;
      display: flex;
      animation: messageIn 0.3s ease;
    }

    @keyframes messageIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.sent { justify-content: flex-end; }
    .message.received { justify-content: flex-start; }

    .message-bubble {
      max-width: 75%;
      padding: 10px 15px;
      border-radius: 15px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.sent .message-bubble {
      background: linear-gradient(135deg, #00f7ff, #0088ff);
      color: #000;
      border-bottom-right-radius: 4px;
    }

    .message.received .message-bubble {
      background: #1a1a3e;
      color: #fff;
      border-bottom-left-radius: 4px;
    }

    .message-time {
      font-size: 0.7rem;
      opacity: 0.7;
      margin-top: 3px;
    }

    .chat-input-area {
      padding: 15px;
      background: #111133;
      display: flex;
      gap: 10px;
      border-top: 1px solid #333;
    }

    .chat-input {
      flex: 1;
      padding: 12px 15px;
      background: #0a0a1a;
      border: 1px solid #333;
      border-radius: 25px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .chat-input:focus { border-color: #00f7ff; }

    .send-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00f7ff, #0088ff);
      border: none;
      color: #000;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .send-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 15px rgba(0, 247, 255, 0.5);
    }

    .back-btn {
      display: inline-block;
      padding: 10px 25px;
      background: transparent;
      border: 2px solid #00f7ff;
      color: #00f7ff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: all 0.3s ease;
      margin-top: 20px;
    }

    .back-btn:hover { background: #00f7ff; color: #000; }

    .footer {
      text-align: center;
      padding: 20px;
      color: #555;
      font-size: 0.85rem;
    }

    .footer span { color: #00f7ff; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">

    <div class="header">
      <h1>💬 Chat with Shyam Sir</h1>
      <p>Koi bhi doubt ho, direct puch!</p>
      <div class="brand">Code With #Shyam</div>
    </div>

    <!-- Name Entry Screen -->
    <div class="name-screen" id="nameScreen">
      <h2>👋 Chat Start Karo!</h2>
      <div class="input-group">
        <label>Tera Naam:</label>
        <input type="text" id="userName" placeholder="Jaise: Prashant" />
      </div>
      <div class="input-group">
        <label>Class / Roll No:</label>
        <input type="text" id="userClass" placeholder="Jaise: Class 10" />
      </div>
      <button class="start-btn" onclick="startChat()">Chat Start Karo 💬</button>
    </div>

    <!-- Chat Interface -->
    <div class="chat-container" id="chatContainer">
      <div class="chat-header">
        <div class="chat-avatar">S</div>
        <div class="chat-header-info">
          <h3>Shyam Sir</h3>
          <span><span class="status-dot"></span>Online</span>
        </div>
      </div>

      <div class="chat-body" id="chatBody"></div>

      <div class="chat-input-area">
        <input type="text" class="chat-input" id="chatInput" placeholder="Message likho..." onkeypress="if(event.key==='Enter') sendMessage()" />
        <button class="send-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>

    <div style="text-align:center;">
      <a href="index.html" class="back-btn">⬅ Back to Home</a>
    </div>

    <div class="footer">
      Made with ❤️ by <span>Code With #Shyam</span>
    </div>

  </div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC8QH1r20GnrSpY9jfxaZKbxSX7OOwA5AY",
      authDomain: "codewithshyam-86c96.firebaseapp.com",
      databaseURL: "https://codewithshyam-86c96-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "codewithshyam-86c96",
      storageBucket: "codewithshyam-86c96.firebasestorage.app",
      messagingSenderId: "275205226924",
      appId: "1:275205226924:web:81d1961f413fa6ac4e3a09"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let userName = '';
    let userClass = '';
    let userId = '';

    window.startChat = function() {
      const name = document.getElementById('userName').value.trim();
      const cls = document.getElementById('userClass').value.trim();

      if (!name || !cls) {
        alert('Please naam aur class dono bhar!');
        return;
      }

      userName = name;
      userClass = cls;
      userId = name.toLowerCase().replace(/\s+/g, '_') + '_' + Date.now();

      // Save user info
      localStorage.setItem('chatUserId', userId);
      localStorage.setItem('chatUserName', userName);
      localStorage.setItem('chatUserClass', userClass);

      document.getElementById('nameScreen').style.display = 'none';
      document.getElementById('chatContainer').classList.add('active');

      // Welcome message
      addMessage('👋 Hello ' + userName + '! Main Shyam hu. Bata kya doubt hai?', 'received');

      // Load previous messages
      loadMessages();
    };

    // Auto-login if returning user
    window.addEventListener('DOMContentLoaded', () => {
      const savedId = localStorage.getItem('chatUserId');
      const savedName = localStorage.getItem('chatUserName');
      const savedClass = localStorage.getItem('chatUserClass');

      if (savedId && savedName) {
        userId = savedId;
        userName = savedName;
        userClass = savedClass;

        document.getElementById('nameScreen').style.display = 'none';
        document.getElementById('chatContainer').classList.add('active');

        loadMessages();
      }
    });

    window.sendMessage = function() {
      const input = document.getElementById('chatInput');
      const message = input.value.trim();
      if (!message) return;

      const messagesRef = ref(db, 'chats/' + userId + '/messages');
      push(messagesRef, {
        text: message,
        sender: 'student',
        senderName: userName,
        senderClass: userClass,
        timestamp: Date.now()
      });

      // Save user info to database
      set(ref(db, 'chats/' + userId + '/info'), {
        name: userName,
        class: userClass,
        lastActive: Date.now()
      });

      input.value = '';
    };

    function loadMessages() {
      const messagesRef = ref(db, 'chats/' + userId + '/messages');
      onValue(messagesRef, (snapshot) => {
        const chatBody = document.getElementById('chatBody');
        chatBody.innerHTML = '';

        // Welcome message
        addMessage('👋 Hello ' + userName + '! Main Shyam hu. Bata kya doubt hai?', 'received');

        const data = snapshot.val();
        if (data) {
          Object.values(data).sort((a, b) => a.timestamp - b.timestamp).forEach(msg => {
            addMessage(msg.text, msg.sender === 'student' ? 'sent' : 'received', msg.timestamp);
          });
        }
      });
    }

    function addMessage(text, type, timestamp) {
      const chatBody = document.getElementById('chatBody');
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message ' + type;

      let time = '';
      if (timestamp) {
        const d = new Date(timestamp);
        time = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
      } else {
        const now = new Date();
        time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
      }

      messageDiv.innerHTML = `
        <div>
          <div class="message-bubble">${text}</div>
          <div class="message-time">${time}</div>
        </div>
      `;

      chatBody.appendChild(messageDiv);
      chatBody.scrollTop = chatBody.scrollHeight;
    }
  </script>
</body>
</html>
