<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Chat | Code With #Shyam</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0a1a;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }

    .container { max-width: 900px; margin: 0 auto; }

    .header {
      text-align: center;
      padding: 25px 20px;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      border-radius: 15px;
      border: 1px solid #00f7ff33;
    }

    .header h1 {
      font-size: 1.8rem;
      color: #00f7ff;
      text-shadow: 0 0 10px rgba(0, 247, 255, 0.5);
      margin-bottom: 5px;
    }

    .header p { color: #aaa; font-size: 0.95rem; }
    .header .brand { color: #fff; font-weight: bold; margin-top: 5px; }

    /* Name Entry Screen */
    .name-screen {
      background: #111133;
      border-radius: 15px;
      padding: 40px 30px;
      text-align: center;
      border: 1px solid #00f7ff33;
      max-width: 500px;
      margin: 0 auto;
    }

    .name-screen h2 {
      color: #00f7ff;
      margin-bottom: 20px;
      font-size: 1.5rem;
    }

    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .input-group label {
      display: block;
      color: #aaa;
      margin-bottom: 8px;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .input-group input {
      width: 100%;
      padding: 12px 15px;
      background: #0a0a1a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .input-group input:focus { border-color: #00f7ff; }

    .start-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #00f7ff, #0088ff);
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(0, 247, 255, 0.5);
    }

    /* Community Chat Interface */
    .chat-container {
      background: #111133;
      border-radius: 15px;
      overflow: hidden;
      border: 1px solid #00f7ff33;
      display: none;
    }

    .chat-container.active { display: block; }

    .chat-header {
      background: linear-gradient(135deg, #00f7ff, #0088ff);
      color: #000;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .group-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
    }

    .chat-header-info h3 { font-size: 1.2rem; margin-bottom: 2px; }
    .chat-header-info span { font-size: 0.85rem; opacity: 0.85; }

    .online-badge {
      background: rgba(0,0,0,0.2);
      padding: 5px 12px;
      border-radius: 15px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #00ff00;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .chat-body {
      height: 500px;
      overflow-y: auto;
      padding: 20px;
      background: #0a0a1a;
    }

    .chat-body::-webkit-scrollbar { width: 8px; }
    .chat-body::-webkit-scrollbar-thumb {
      background: #00f7ff44;
      border-radius: 10px;
    }

    /* Date Separator */
    .date-separator {
      text-align: center;
      margin: 15px 0;
      color: #666;
      font-size: 0.8rem;
      position: relative;
    }

    .date-separator span {
      background: #0a0a1a;
      padding: 5px 15px;
      border-radius: 12px;
      border: 1px solid #333;
    }

    /* Messages */
    .message {
      margin-bottom: 15px;
      display: flex;
      animation: messageIn 0.3s ease;
      gap: 10px;
    }

    @keyframes messageIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.own { flex-direction: row-reverse; }

    .message-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
      flex-shrink: 0;
      font-size: 1rem;
    }

    .message-content {
      max-width: 70%;
    }

    .message.own .message-content {
      align-items: flex-end;
      display: flex;
      flex-direction: column;
    }

    .message-info {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px;
      font-size: 0.8rem;
      flex-wrap: wrap;
    }

    .message-name {
      font-weight: bold;
      color: #00f7ff;
    }

    .message.own .message-name {
      color: #00ff88;
    }

    .message-class {
      color: #666;
      font-size: 0.75rem;
    }

    .admin-badge {
      background: linear-gradient(135deg, #ffd700, #ff6600);
      color: #000;
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 0.7rem;
      font-weight: bold;
    }

    .message-bubble {
      padding: 10px 15px;
      border-radius: 15px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
      background: #1a1a3e;
      color: #fff;
      border-bottom-left-radius: 4px;
    }

    .message.own .message-bubble {
      background: linear-gradient(135deg, #00ff88, #00cc66);
      color: #000;
      border-bottom-right-radius: 4px;
      border-bottom-left-radius: 15px;
    }

    .message.admin .message-bubble {
      background: linear-gradient(135deg, #ffd700, #ff6600);
      color: #000;
      border: 2px solid #ffaa00;
    }

    .message-time {
      font-size: 0.7rem;
      color: #666;
      margin-top: 3px;
    }

    .message.own .message-time { text-align: right; }

    /* Input Area */
    .chat-input-area {
      padding: 15px;
      background: #111133;
      display: flex;
      gap: 10px;
      border-top: 1px solid #333;
    }

    .chat-input {
      flex: 1;
      padding: 12px 15px;
      background: #0a0a1a;
      border: 1px solid #333;
      border-radius: 25px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .chat-input:focus { border-color: #00f7ff; }

    .send-btn {
      padding: 12px 25px;
      background: linear-gradient(135deg, #00f7ff, #0088ff);
      border: none;
      color: #000;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      border-radius: 25px;
    }

    .send-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(0, 247, 255, 0.5);
    }

    .rules-box {
      background: rgba(255, 165, 0, 0.1);
      border: 1px solid #ffa500;
      border-radius: 10px;
      padding: 12px 15px;
      margin-top: 15px;
      font-size: 0.85rem;
      color: #ffa500;
      text-align: center;
    }

    .back-btn {
      display: inline-block;
      padding: 10px 25px;
      background: transparent;
      border: 2px solid #00f7ff;
      color: #00f7ff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: all 0.3s ease;
      margin-top: 20px;
    }

    .back-btn:hover { background: #00f7ff; color: #000; }

    .footer {
      text-align: center;
      padding: 20px;
      color: #555;
      font-size: 0.85rem;
    }

    .footer span { color: #00f7ff; font-weight: bold; }

    @media (max-width: 600px) {
      .chat-body { height: 400px; }
      .message-content { max-width: 80%; }
      .message-avatar { width: 32px; height: 32px; font-size: 0.85rem; }
      .header h1 { font-size: 1.4rem; }
      .send-btn { padding: 10px 15px; }
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="header">
      <h1>💬 Python Class Community</h1>
      <p>Sab ek saath baat karo, sab ka doubt yahi solve!</p>
      <div class="brand">Code With #Shyam</div>
    </div>

    <!-- Name Entry -->
    <div class="name-screen" id="nameScreen">
      <h2>👋 Community Join Karo!</h2>
      <div class="input-group">
        <label>Tera Naam:</label>
        <input type="text" id="userName" placeholder="Jaise: Prashant" maxlength="20" />
      </div>
      <div class="input-group">
        <label>Class / Roll No:</label>
        <input type="text" id="userClass" placeholder="Jaise: Class 10" maxlength="15" />
      </div>
      <button class="start-btn" onclick="joinChat()">Community Join Karo 🚀</button>

      <div class="rules-box">
        📋 <strong>Rules:</strong> Respectful raho, gaali nahi dena, spam mat karo!
      </div>
    </div>

    <!-- Chat -->
    <div class="chat-container" id="chatContainer">
      <div class="chat-header">
        <div class="chat-header-left">
          <div class="group-icon">🐍</div>
          <div class="chat-header-info">
            <h3>Python Learners Group</h3>
            <span id="memberCount">Loading...</span>
          </div>
        </div>
        <div class="online-badge">
          <span class="status-dot"></span>
          <span id="onlineCount">Live</span>
        </div>
      </div>

      <div class="chat-body" id="chatBody">
        <div style="text-align:center; color:#666; padding:20px;">
          Loading messages...
        </div>
      </div>

      <div class="chat-input-area">
        <input type="text" class="chat-input" id="chatInput" placeholder="Message likho..." maxlength="500" onkeypress="if(event.key==='Enter') sendMessage()" />
        <button class="send-btn" onclick="sendMessage()">Send ➤</button>
      </div>
    </div>

    <div style="text-align:center;">
      <a href="index.html" class="back-btn">⬅ Back to Home</a>
    </div>

    <div class="footer">
      Made with ❤️ by <span>Code With #Shyam</span>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, set, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC8QH1r20GnrSpY9jfxaZKbxSX7OOwA5AY",
      authDomain: "codewithshyam-86c96.firebaseapp.com",
      databaseURL: "https://codewithshyam-86c96-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "codewithshyam-86c96",
      storageBucket: "codewithshyam-86c96.firebasestorage.app",
      messagingSenderId: "275205226924",
      appId: "1:275205226924:web:81d1961f413fa6ac4e3a09"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let userName = '';
    let userClass = '';
    let userId = '';

    // Avatar colors
    const avatarColors = [
      '#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#6c5ce7',
      '#a29bfe', '#fd79a8', '#00b894', '#e17055', '#0984e3'
    ];

    function getAvatarColor(name) {
      const index = name.charCodeAt(0) % avatarColors.length;
      return avatarColors[index];
    }

    window.joinChat = function() {
      const name = document.getElementById('userName').value.trim();
      const cls = document.getElementById('userClass').value.trim();

      if (!name || !cls) {
        alert('Naam aur class dono bhar bhai!');
        return;
      }

      if (name.length < 2) {
        alert('Naam thoda bada rakh!');
        return;
      }

      userName = name;
      userClass = cls;
      userId = name.toLowerCase().replace(/\s+/g, '_') + '_' + Date.now();

      localStorage.setItem('communityUserId', userId);
      localStorage.setItem('communityUserName', userName);
      localStorage.setItem('communityUserClass', userClass);

      document.getElementById('nameScreen').style.display = 'none';
      document.getElementById('chatContainer').classList.add('active');

      loadCommunityChat();
      trackOnlineStatus();
    };

    // Auto-login
    window.addEventListener('DOMContentLoaded', () => {
      const savedId = localStorage.getItem('communityUserId');
      const savedName = localStorage.getItem('communityUserName');
      const savedClass = localStorage.getItem('communityUserClass');

      if (savedId && savedName) {
        userId = savedId;
        userName = savedName;
        userClass = savedClass;

        document.getElementById('nameScreen').style.display = 'none';
        document.getElementById('chatContainer').classList.add('active');

        loadCommunityChat();
        trackOnlineStatus();
      }
    });

    window.sendMessage = function() {
      const input = document.getElementById('chatInput');
      const message = input.value.trim();
      if (!message) return;

      const messagesRef = ref(db, 'community/messages');
      push(messagesRef, {
        text: message,
        senderName: userName,
        senderClass: userClass,
        senderId: userId,
        isAdmin: false,
        timestamp: Date.now()
      });

      input.value = '';
    };

    function loadCommunityChat() {
      const messagesRef = ref(db, 'community/messages');
      onValue(messagesRef, (snapshot) => {
        const chatBody = document.getElementById('chatBody');
        chatBody.innerHTML = '';

        const data = snapshot.val();
        if (!data) {
          chatBody.innerHTML = '<div style="text-align:center; color:#666; padding:40px;">🎉 Community abhi khali hai. Pehla message tu bhej!</div>';
          return;
        }

        const messages = Object.values(data).sort((a, b) => a.timestamp - b.timestamp);
        let lastDate = '';

        messages.forEach(msg => {
          const msgDate = new Date(msg.timestamp).toLocaleDateString('en-IN');
          if (msgDate !== lastDate) {
            const separator = document.createElement('div');
            separator.className = 'date-separator';
            separator.innerHTML = `<span>📅 ${msgDate}</span>`;
            chatBody.appendChild(separator);
            lastDate = msgDate;
          }

          addMessage(msg);
        });

        chatBody.scrollTop = chatBody.scrollHeight;
      });
    }

    function addMessage(msg) {
      const chatBody = document.getElementById('chatBody');
      const messageDiv = document.createElement('div');
      const isOwn = msg.senderId === userId;
      const isAdmin = msg.isAdmin === true;

      let className = 'message';
      if (isOwn) className += ' own';
      if (isAdmin) className += ' admin';
      messageDiv.className = className;

      const time = new Date(msg.timestamp);
      const timeStr = time.getHours().toString().padStart(2,'0') + ':' + time.getMinutes().toString().padStart(2,'0');

      const avatarLetter = (msg.senderName || 'U')[0].toUpperCase();
      const avatarColor = isAdmin ? '#ffd700' : getAvatarColor(msg.senderName || 'User');

      messageDiv.innerHTML = `
        <div class="message-avatar" style="background: ${avatarColor};">
          ${avatarLetter}
        </div>
        <div class="message-content">
          <div class="message-info">
            <span class="message-name">${escapeHtml(msg.senderName || 'Unknown')}</span>
            ${isAdmin ? '<span class="admin-badge">👑 SHYAM SIR</span>' : `<span class="message-class">${escapeHtml(msg.senderClass || '')}</span>`}
          </div>
          <div class="message-bubble">${escapeHtml(msg.text)}</div>
          <div class="message-time">${timeStr}</div>
        </div>
      `;

      chatBody.appendChild(messageDiv);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Track online users
    function trackOnlineStatus() {
      const userStatusRef = ref(db, 'community/online/' + userId);
      set(userStatusRef, {
        name: userName,
        class: userClass,
        lastSeen: Date.now()
      });

      // Remove on disconnect
      onDisconnect(userStatusRef).remove();

      // Count online users
      const onlineRef = ref(db, 'community/online');
      onValue(onlineRef, (snapshot) => {
        const data = snapshot.val();
        const count = data ? Object.keys(data).length : 0;
        document.getElementById('onlineCount').textContent = count + ' online';
        document.getElementById('memberCount').textContent = count + ' members active';
      });

      // Update presence every 30 sec
      setInterval(() => {
        set(userStatusRef, {
          name: userName,
          class: userClass,
          lastSeen: Date.now()
        });
      }, 30000);
    }
  </script>
</body>
</html>
